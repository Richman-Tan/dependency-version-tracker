# Copy into the consumer repo as .github/workflows/dependency-report.yml
# and replace <org> with the GitHub org/user hosting dependency-version-tracker.
name: Dependency version report

on:
  schedule:
    - cron: "0 18 * * 1-5" # ~06:00-07:00 NZ time, weekdays
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the table without writing the sheet
        type: boolean
        default: false

# The reusable workflow only ever reads the repo. Declaring that here too keeps
# the job at least-privilege even in orgs whose default token is read-write.
permissions:
  contents: read

jobs:
  report:
    uses: <org>/dependency-version-tracker/.github/workflows/track-versions.yml@v1
    with:
      sheet-id: "<spreadsheet id from the sheet URL>"
      config-path: tracked-packages.json
      dry-run: ${{ inputs.dry-run || false }}
    secrets:
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      # Uncomment if the tracker repo is private:
      # TOOLING_REPO_TOKEN: ${{ secrets.TOOLING_REPO_TOKEN }}
      # Uncomment (and set repo variables PRIVATE_NPM_REGISTRY_URL /
      # PRIVATE_NUGET_INDEX_URL) to enable private-feed latest lookups:
      # PRIVATE_NPM_TOKEN: ${{ secrets.PRIVATE_NPM_TOKEN }}
      # PRIVATE_NUGET_TOKEN: ${{ secrets.PRIVATE_NUGET_TOKEN }}
