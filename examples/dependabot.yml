# Copy into the consumer repo as .github/dependabot.yml
#
# Dependabot is built into GitHub — no app to install, no third party. It is
# the upgrade-PR half of this tool; the sheet is the reporting half, and the
# two are designed to divide the work:
#
#   patch  -> automerged (see examples/dependabot-automerge.yml)
#   minor  -> a PR, labelled, waiting for review
#   major  -> NO PR. Dependabot has no way to hold one for approval, and
#             letting majors open PRs unprompted is how a repo ends up with
#             fifteen stale branches nobody wants to be the one to merge.
#             Majors are ignored here and surface in the sheet as `major`
#             drift instead, which is the deliberate-decision queue.
#
# That last point is the real difference from Renovate, which has a Dependency
# Dashboard for exactly this. Here the Google Sheet plays that role.

version: 2

updates:
  # ---------------------------------------------------------------- npm ----
  - package-ecosystem: npm
    # `directories` (plural) supports globs; `directory` (singular) does not.
    # One entry per site in a multi-site repo, without listing them by hand.
    directories:
      - "/"
      - "/apps/*/ClientApp"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Pacific/Auckland"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      # Grouping keeps the PR count down. Patch and minor MUST be separate
      # groups, though: dependabot/fetch-metadata reports the HIGHEST
      # update-type in a grouped PR, so bundling a patch with a minor makes the
      # whole PR read as `minor` and the automerge condition never matches.
      # The result is a workflow that looks correct and silently does nothing.
      npm-patch:
        applies-to: version-updates
        update-types:
          - patch
      npm-minor:
        applies-to: version-updates
        update-types:
          - minor
    ignore:
      # Majors are reported in the sheet, not opened as PRs. Remove this block
      # if you would rather triage them as PRs.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # -------------------------------------------------------------- NuGet ----
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/src/*"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Pacific/Auckland"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    groups:
      # Separate patch from minor — see the note on the npm groups above.
      nuget-patch:
        applies-to: version-updates
        update-types:
          - patch
      nuget-minor:
        applies-to: version-updates
        update-types:
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ----------------------------------------------- GitHub Actions itself ----
  # Cheap to keep current, and the thing that warns about runner deprecations.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
